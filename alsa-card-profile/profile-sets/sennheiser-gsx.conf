# User override of /usr/share/alsa-card-profile/mixer/profile-sets/sennheiser-gsx.conf
#
# Changes from stock:
#  - removed "skip-probe = yes" from both profiles. With skip-probe ACP never
#    builds mixer paths, so no output was bound to PCM,1 and the sink used
#    software volume. That leaves the GSX's own gain pinned and out of sync
#    with the OS slider.
#  - stereo-output (2.0 HD) gets paths-output = sennheiser-gsx-pcm1, so the
#    OS volume drives PCM,1 the way Windows does.
#
# Remove this file (and ../paths/sennheiser-gsx-pcm1.conf), then restart
# wireplumber to go back to stock behaviour.

[General]
auto-profiles = no

[Mapping analog-chat-output]
description-key = gaming-headset-chat
device-strings = hw:%f,0
channel-map = mono
paths-output = analog-chat-output
direction = output
priority = 4000
intended-roles = phone

[Mapping analog-output-surround71]
description-key = analog-surround-71
device-strings = hw:%f,1
channel-map = front-left,front-right,rear-left,rear-right,front-center,lfe,side-left,side-right
paths-output = virtual-surround-7.1
priority = 4100
direction = output

[Mapping analog-chat-input]
description-key = gaming-headset-chat
device-strings = hw:%f,0
channel-map = mono
paths-input = analog-chat-input
priority = 4100
direction = input

[Profile output:analog-output-surround71+output:analog-output-chat+input:analog-input]
output-mappings = analog-output-surround71 analog-chat-output
input-mappings = analog-chat-input
priority = 5100

[Mapping stereo-output]
description = 2.0 HD
device-strings = hw:%f,1
channel-map = stereo
paths-output = sennheiser-gsx-pcm1
priority = 3
direction = output

[Profile output:stereo-output+output:analog-chat-output+input:analog-chat-input]
description = 2.0 HD
output-mappings = stereo-output analog-chat-output
input-mappings = analog-chat-input
priority = 50
