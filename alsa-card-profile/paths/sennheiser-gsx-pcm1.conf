# User override: bind the GSX 1000/1200 main playback gain (PCM,1, 0..74,
# -74..0 dB) as the sink's hardware volume for the 2.0 HD mapping.
# Same element settings as the stock virtual-surround-7.1 path.

[General]
description-key = analog-output

[Element PCM,1]
switch = mute
volume = merge
override-map.1 = all
override-map.2 = all-left,all-right
